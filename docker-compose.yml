services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcp_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_gateway"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__McpGateway: Host=postgres;Port=5432;Database=mcp_gateway;Username=postgres;Password=postgres
      Auth__SigningKey: local-development-signing-key-change-me-32b!
      Auth__Bootstrap__ClientId: gateway_admin
      Auth__Bootstrap__ClientSecret: local-dev-bootstrap-secret
    ports:
      - "8080:8080"

volumes:
  pgdata:
