<h2 mat-dialog-title>Client secret for {{ data.clientId }}</h2>
<mat-dialog-content>
  <p class="warning">
    <mat-icon>warning</mat-icon>
    This secret is shown only once. Copy it now — it cannot be retrieved later.
  </p>
  <div class="secret">
    <code>{{ data.clientSecret }}</code>
    <button mat-icon-button (click)="copy()" [attr.aria-label]="'Copy secret'">
      <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
    </button>
  </div>
  @if (copied()) {
    <p class="copied">Copied to clipboard.</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" [mat-dialog-close]="true">Done</button>
</mat-dialog-actions>
