<div class="login-page">
  <mat-card class="login-card">
    @if (submitting()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card-header>
      <mat-card-title>MCP Gateway</mat-card-title>
      <mat-card-subtitle>Admin console sign-in</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Client ID</mat-label>
          <input matInput name="clientId" [(ngModel)]="clientId" autocomplete="username" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Client secret</mat-label>
          <input
            matInput
            type="password"
            name="clientSecret"
            [(ngModel)]="clientSecret"
            autocomplete="current-password"
            required
          />
        </mat-form-field>

        @if (error()) {
          <p class="login-error">{{ error() }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="submitting() || !clientId || !clientSecret"
        >
          Sign in
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
