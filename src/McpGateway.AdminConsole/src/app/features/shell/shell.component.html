<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell-nav">
    <div class="brand">
      <mat-icon>hub</mat-icon>
      <span>MCP Gateway</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar">
      <span class="spacer"></span>

      @if (!isAdmin()) {
        <span class="badge-warn" matTooltip="This identity lacks the gateway.admin scope; operator actions are hidden.">
          <mat-icon>lock</mat-icon> read-only
        </span>
      }

      <span
        class="session"
        [class.expiring]="sessionExpiring()"
        matTooltip="Time left before the token expires"
      >
        <mat-icon>schedule</mat-icon> {{ sessionLabel() }}
      </span>

      <span class="client-id" matTooltip="Signed-in client id">{{ clientId() }}</span>

      <button mat-icon-button (click)="signOut()" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
